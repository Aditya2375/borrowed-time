name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BT_API_KEY: ${{ secrets.BT_API_KEY }}
  BT_VERSION_CODE: ${{ github.run_number }}
  BT_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" | tail -2
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Keystore
        run: |
          echo "${{ secrets.BT_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/bt.jks"
          echo "BT_KEYSTORE=$RUNNER_TEMP/bt.jks" >> "$GITHUB_ENV"
          echo "BT_KS_PASS=${{ secrets.BT_KS_PASS }}" >> "$GITHUB_ENV"
          echo "BT_KEY_ALIAS=${{ secrets.BT_KEY_ALIAS }}" >> "$GITHUB_ENV"
      - name: Build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/borrowed-time-debug.apk
          cp app/build/outputs/apk/release/*.apk out/borrowed-time.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: sh ci/shots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0 >/dev/null 2>&1 || gh release create v1.0 --title "Borrowed Time" --notes "Install borrowed-time.apk on Android 8 or newer. Allow installs from your browser when asked."
          gh release upload v1.0 out/borrowed-time.apk --clobber
